<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Freestyle Fuego</title>
<style>
:root{--ink:#101015;--lime:#d9ff43;--pink:#ff4d88;--paper:#f7f4ed}*{box-sizing:border-box}body{margin:0;background:#17171d;color:var(--ink);font-family:Impact,'Arial Black',sans-serif;overflow:hidden;touch-action:none}.shell{height:100dvh;padding:clamp(10px,2vw,22px);display:grid;gap:12px}.game{position:relative;border:3px solid #050507;border-radius:22px;overflow:hidden;background:var(--paper);box-shadow:0 10px 0 #050507;height:calc(100dvh - 24px)}canvas{display:block;width:100%;height:100%}.hud{position:absolute;z-index:3;inset:0 0 auto 0;padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.brand{font-size:clamp(18px,3vw,36px);line-height:.82;letter-spacing:-1px}.brand span{display:block;color:var(--pink);font-size:.55em;margin-top:7px}.stats{text-align:right}.score{font-family:ui-monospace,monospace;font-size:clamp(22px,4vw,48px);line-height:.9}.combo{margin-top:7px;background:var(--lime);border:2px solid var(--ink);border-radius:999px;padding:5px 10px;font:900 12px ui-monospace,monospace}.center{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(247,244,237,.82);backdrop-filter:blur(7px);transition:.25s}.center.hidden{opacity:0;pointer-events:none}.card{text-align:center;width:min(520px,86vw)}.card h1{margin:0;font-size:clamp(58px,12vw,120px);line-height:.78;letter-spacing:-5px;text-transform:uppercase}.card h1 em{display:block;color:var(--pink);font-style:normal}.card p{font:800 14px ui-monospace,monospace;margin:18px 0 22px}.button{border:3px solid var(--ink);border-radius:14px;background:var(--lime);box-shadow:6px 7px 0 var(--ink);font:900 18px ui-monospace,monospace;padding:14px 22px;cursor:pointer;color:var(--ink)}.button:active{transform:translate(4px,5px);box-shadow:2px 2px 0 var(--ink)}.controls{position:absolute;z-index:4;left:18px;right:18px;bottom:16px;display:flex;justify-content:space-between;pointer-events:none}.ctrl{width:70px;height:70px;border:3px solid var(--ink);border-radius:50%;background:rgba(247,244,237,.82);box-shadow:4px 5px 0 var(--ink);font-size:28px;pointer-events:auto;user-select:none}.controls>div{display:flex;gap:10px}.burst{position:absolute;z-index:2;pointer-events:none;font:900 20px ui-monospace,monospace;color:var(--pink);transform:rotate(-8deg);text-shadow:2px 2px #fff}.meter{position:absolute;z-index:3;left:50%;bottom:18px;transform:translateX(-50%);width:min(180px,28vw);height:10px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}.meter i{display:block;height:100%;width:100%;background:var(--lime);transform-origin:left}@media(max-width:600px){.shell{padding:6px}.game{height:calc(100dvh - 12px);border-radius:16px}.hud{padding:11px}.controls{left:10px;right:10px;bottom:10px}.ctrl{width:58px;height:58px}.meter{bottom:76px;width:120px}.brand{font-size:21px}}
</style>
</head>
<body><main class="shell"><section class="game" id="game">
<canvas id="canvas"></canvas><div class="hud"><div class="brand">FREESTYLE<span>BATALLA URBANA</span></div><div class="stats"><div class="score" id="score">00000</div><div class="combo" id="combo">COMBO x1</div></div></div>
<div class="meter" id="meter"><i></i></div><div class="controls"><div><button class="ctrl" data-dir="left">◀</button><button class="ctrl" data-dir="right">▶</button></div><button class="ctrl" id="jump">↑</button></div>
<div class="center" id="overlay"><div class="card"><h1 id="title">FREESTYLE<em>FUEGO</em></h1><p id="subtitle">ESQUIVA LAS FALLAS · ENCUENTRA EL RITMO</p><button class="button" id="start">¡ROMPER EL BEAT!</button></div></div>
</section></main>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),game=document.getElementById('game'),overlay=document.getElementById('overlay'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),start=document.getElementById('start'),scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),meter=document.querySelector('.meter i');
let W,H,dpr,playing=false,last=0,score=0,combo=1,time=0,spawn=0,beat=0,obstacles=[],particles=[],keys={};
const player={x:0,y:0,vx:0,vy:0,r:24,ground:0};
function resize(){const r=game.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);player.ground=H-115;if(!player.y)player.y=player.ground}
addEventListener('resize',resize);resize();
function reset(){obstacles=[];particles=[];score=0;combo=1;time=0;spawn=.8;beat=0;player.x=W*.5;player.y=player.ground;player.vx=0;player.vy=0;playing=true;overlay.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
function burst(text,x,y){const e=document.createElement('div');e.className='burst';e.textContent=text;e.style.left=x+'px';e.style.top=y+'px';game.appendChild(e);setTimeout(()=>e.remove(),700)}
function spawnObstacle(){const types=['MC','¯\\_(ツ)_/¯','FAIL','BOOM','HATER'];const type=types[Math.floor(Math.random()*types.length)];const side=Math.random()<.5?-1:1;obstacles.push({x:side<0?W+80:-80,y:player.ground-24,vx:(side<0?-1:1)*(220+Math.random()*100+time*5),type,r:28,hit:false})}
function jump(){if(!playing)return;if(player.y>=player.ground-2){player.vy=-520;for(let i=0;i<7;i++)particles.push({x:player.x,y:player.y+22,vx:(Math.random()-.5)*180,vy:Math.random()*-100,life:.5,color:'#d9ff43'})}}
start.onclick=reset;document.getElementById('jump').onclick=jump;
document.querySelectorAll('[data-dir]').forEach(b=>{const dir=b.dataset.dir;const down=e=>{e.preventPreventDefault?.();keys[dir]=true};const up=()=>keys[dir]=false;b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up)});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key===' '||e.key==='ArrowUp'||e.key==='w')jump();if(!playing&&(e.key==='Enter'||e.key===' '))reset()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false});
function end(){playing=false;title.innerHTML='FIN DEL<em>ROUND</em>';subtitle.textContent=`PUNTOS ${String(Math.floor(score)).padStart(5,'0')} · COMBO FINAL x${combo}`;start.textContent='OTRA BATALLA';overlay.classList.remove('hidden')}
function loop(now){if(!playing)return;const dt=Math.min(.033,(now-last)/1000);last=now;time+=dt;spawn-=dt;beat=(beat+dt)%1;
let ax=0;if(keys.left)ax-=1;if(keys.right)ax+=1;player.vx+=(ax*850-player.vx*8)*dt;player.x+=player.vx*dt;player.x=Math.max(45,Math.min(W-45,player.x));player.vy+=1250*dt;player.y+=player.vy*dt;if(player.y>player.ground){player.y=player.ground;player.vy=0}
if(spawn<=0){spawnObstacle();spawn=Math.max(.42,1.05-time*.008)*(0.75+Math.random*.5)}
for(const o of obstacles){o.x+=o.vx*dt;if(!o.hit&&Math.hypot(o.x-player.x,o.y-player.y)<r=o.r+player.r){o.hit=true;end();break}}
obstacles=obstacles.filter(o=>o.x>-120&&o.x<W+120&&!o.hit);
if(!obstacles.some(o=>o.hit)){score+=dt*(10+combo*2);if(Math.floor(time*2)!==Math.floor((time-dt)*2)&&player.y>=player.ground-2){combo=Math.min(9,combo+1);score+=50*combo}}
particles=particles.filter(p=>p.life>0);for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt}
scoreEl.textContent=String(Math.floor(score)).padStart(5,'0');comboEl.textContent='COMBO x'+combo;meter.style.transform='scaleX('+Math.max(.08,1-(time%8)/8)+')';draw();if(playing)requestAnimationFrame(loop)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#f7f4ed';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#ded8cb';ctx.lineWidth=2;for(let y=120;y<H-70;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let x=(time*18)%64;x<W;x+=64){ctx.beginPath();ctx.moveTo(x,100);ctx.lineTo(x,H-80);ctx.stroke()}
ctx.fillStyle='#b8b2a7';ctx.globalAlpha=.22;for(let i=0;i<6;i++){ctx.beginPath();ctx.arc((i*211+time*5)% (W+100),H*.18+(i%3)*95,3+i,0,7);ctx.fill()}ctx.globalAlpha=1;
ctx.fillStyle='#101015';ctx.fillRect(0,H-80,W,80);ctx.fillStyle='#ff4d88';ctx.fillRect(0,H-84,W,5);
for(let i=0;i<particles.length;i++){const p=particles[i];ctx.fillStyle=p.color;ctx.globalAlpha=p.life*2;ctx.fillRect(p.x,p.y,5,5)}ctx.globalAlpha=1;
ctx.save();ctx.translate(player.x,player.y);ctx.rotate(Math.sin(time*10)*.06+(player.vx/W)*.15);ctx.fillStyle='#d9ff43';ctx.strokeStyle='#101015';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-18,24,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#101015';ctx.beginPath();ctx.arc(-8,-22,3,0,7);ctx.arc(8,-22,3,0,7);ctx.fill();ctx.beginPath();ctx.arc(0,-11,8,0,Math.PI);ctx.stroke();ctx.fillStyle='#ff4d88';ctx.fillRect(-17,-47,34,9);ctx.restore();
for(const o of obstacles){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(Math.sin(time*5+o.x)*.08);ctx.fillStyle='#101015';ctx.fillRect(-32,-32,64,64);ctx.fillStyle='#f7f4ed';ctx.font='900 12px ui-monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.type,0,0);ctx.restore()} }
resize();
</script></body></html>
